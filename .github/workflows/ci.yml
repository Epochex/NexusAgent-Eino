name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_eino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_eino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./... -timeout 180s
      - run: go test -race -tags=integration ./internal/service ./internal/execution ./internal/api ./internal/ingestion ./internal/repo ./internal/memory/long_term ./internal/tool ./internal/a2a ./internal/capacity ./cmd/loadtest -count=1 -timeout 240s
        env:
          NX_TEST_DATABASE_DSN: postgres://postgres@localhost:5432/nexus_eino_test?sslmode=disable
          NX_TEST_REDIS_ADDR: localhost:6379
      - run: go build ./cmd/server ./cmd/worker ./cmd/cli ./cmd/migrate ./cmd/docparser ./cmd/loadtest
  data-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_TEST_DATABASE_DSN: postgres://postgres@127.0.0.1:55449/nexus_acceptance_test?sslmode=disable
      NX_TEST_MILVUS_ADDR: 127.0.0.1:59530
      NX_TEST_MINIO_ADDR: 127.0.0.1:59000
      NX_TEST_REDIS_ADDR: 127.0.0.1:56399
      GOMEMLIMIT: 1GiB
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: backend/go.sum
      - run: docker compose -f backend/deployments/docker-compose.acceptance.yaml up -d --wait --wait-timeout 180
      - run: |
          # setup-go may miss the cache on a fresh runner; --mount requires an
          # existing bind source even though Go itself creates it on first use.
          mkdir -p "$(go env GOMODCACHE)"
          docker run --rm --network nexus-eino-acceptance_default --network nexus-eino-acceptance_parser --cpus=2 --memory=2g \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/workspace \
            --env 'NX_TEST_DATABASE_DSN=postgres://postgres@postgres:5432/nexus_acceptance_test?sslmode=disable' \
            --env NX_TEST_REDIS_ADDR=redis:6379 --env NX_TEST_MILVUS_ADDR=milvus:19530 --env NX_TEST_MINIO_ADDR=minio:9000 \
            --env NX_TEST_PDF_PARSER_URL=http://docparser:8095 --env NX_TEST_PDF_PARSER_TOKEN=public-parser-acceptance-token-32-characters \
            --env GOMEMLIMIT=1GiB --env GOMAXPROCS=2 \
            --mount "type=bind,source=$PWD,target=/workspace" --mount "type=bind,source=$(go env GOMODCACHE),target=/go/pkg/mod" \
            --mount type=volume,source=nexus-eino-go-build,target=/root/.cache/go-build -w /workspace/backend \
            golang@sha256:fb612b7831d53a89cbc0aaa7855b69ad7b0caf603715860cf538df854d047b84 \
            go test -p 1 -race -tags 'integration infrastructure' ./internal/vector ./internal/service ./internal/memory/long_term ./internal/execution ./internal/api ./internal/rag/loader -run 'TestMilvusUpsertAndDimensionContract|TestMilvusScope|TestMemoryScope|TestDocumentPipelineRealInfrastructure|TestFixed100QueryRetrievalEvaluation|TestMemoryPipeline|TestMemorySupersededMigration|TestMemoryWorkerProcess|TestMemoryHTTP|TestA2AServerProcess|TestChatServerProcess|TestPDFParserContainer' -count=1 -timeout 300s -v
      - if: failure()
        run: docker compose -f backend/deployments/docker-compose.acceptance.yaml logs --tail 100
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
