# NexusAgent 基础设施编排（td.md §11）
# 分组点亮：core = 最小可运行（Ep 02） / full = 含检索与消息 / obs = 观测栈
#
# 用法：
#   docker compose --profile core up -d          # PG/Redis/MinIO
#   docker compose --profile full up -d          # + Milvus/Ollama/SearXNG
#   docker compose --profile obs up -d           # + Jaeger/Prometheus/Grafana

name: nexus-agent

services:
  # ---- 核心（P0 必需） ----
  postgres:
    image: postgres:16-alpine
    profiles: [core, full, obs]
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus123
      POSTGRES_DB: nexus_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [core, full, obs]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    profiles: [core, full, obs]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # ---- 检索与模型（RAG/MCP 相关集） ----
  etcd: # Milvus 依赖
    image: quay.io/coreos/etcd:v3.5.14
    profiles: [full, obs]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus:
    image: milvusdb/milvus:v2.5.6
    profiles: [full, obs]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on: [etcd]
    ports: ["19530:19530"]
    volumes: [milvusdata:/var/lib/milvus]

  milvus-minio: # Milvus 专用 MinIO（与业务 MinIO 隔离）
    image: minio/minio:latest
    profiles: [full, obs]
    command: minio server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [milvusminiodata:/data]

  ollama: # 教学本地模型（local: true 时全流程零外部依赖）
    image: ollama/ollama:latest
    profiles: [full]
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]

  searxng: # web_search 工具后端
    image: searxng/searxng:latest
    profiles: [full]
    ports: ["8081:8080"]
    volumes: ["./searxng:/etc/searxng:ro"]

  # ---- 观测栈 ----
  jaeger: # OTLP HTTP :4318
    image: jaegertracing/all-in-one:1.57
    profiles: [obs]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["4318:4318", "16686:16686"]

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [obs]
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3004:3000"]
    volumes: [grafanadata:/var/lib/grafana, "./grafana/provisioning:/etc/grafana/provisioning:ro"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  milvusdata:
  milvusminiodata:
  ollamadata:
  grafanadata:
