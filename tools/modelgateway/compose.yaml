name: nexus-modelgateway-acceptance
services:
  proxy:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [fixture]
    depends_on: [gateway]
  fixture:
    image: python@sha256:2c285c669cc837aa3bcf1af23ea1932b7b5214f9c9d3aad22417446ad91cb4fb
    command: [python, /suite/fixture.py]
    volumes:
      - .:/suite:ro
    networks: [fixture]
  gateway:
    image: calciumion/new-api@sha256:938fa2713d4946723c9e9ce3076351c33f7770699fec92d23f3a26fd95791026
    environment:
      SQLITE_PATH: /data/one-api.db
      SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?set an ephemeral random secret}
      PASSWORD_LOGIN_ENCRYPTION_ENABLED: 'false'
      RELAY_TIMEOUT: '2'
      STREAMING_TIMEOUT: '2'
      GLOBAL_API_RATE_LIMIT: '10000'
      GLOBAL_WEB_RATE_LIMIT: '10000'
      BATCH_UPDATE_ENABLED: 'false'
      TRUSTED_PROXIES: none
    tmpfs: [/data]
    networks: [fixture]
    depends_on: [fixture]
networks:
  fixture:
    internal: true
